name: CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  backend:
    runs-on: ubuntu-latest

    env:
      DB_HOST: 127.0.0.1
      DB_PORT: "3306"
      DB_NAME: testdb
      DB_USER: testuser
      DB_PASSWORD: testpassword
      JWT_SECRET_KEY: test-secret-key-for-ci-only

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Run backend tests
        working-directory: backend
        run: pytest

  frontend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run ESLint
        working-directory: frontend
        run: npm run lint

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  docker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build backend Docker image
        working-directory: backend
        run: docker build -t ml-admin-api:ci .

  deploy:
    runs-on: ubuntu-latest

    needs:
      - backend
      - frontend
      - docker

    # Deploy only for pushes to main.
    # Pull requests run CI but do not deploy.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Deploy to OCI
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ${{ secrets.OCI_USER }}
          key: ${{ secrets.OCI_SSH_KEY }}
          script: |
            set -e

            cd ~/Fastapi-react-admin-panel

            echo "Updating source code..."
            git fetch origin
            git reset --hard origin/main

            IMAGE_TAG="ml-admin-api:${{ github.sha }}"

            echo "Building Docker image: ${IMAGE_TAG}"
            docker build -t "${IMAGE_TAG}" ./backend

            echo "Stopping current container..."
            docker stop ml-admin-api || true
            docker rm ml-admin-api || true

            echo "Starting new container..."
            docker run -d \
              --name ml-admin-api \
              --env-file ~/ml-admin-api.env \
              -p 8000:8000 \
              --restart unless-stopped \
              "${IMAGE_TAG}"

            echo "Waiting for application..."
            sleep 5

            echo "Running health check..."
            curl -f http://localhost:8000/health

            echo "Deployment successful."
